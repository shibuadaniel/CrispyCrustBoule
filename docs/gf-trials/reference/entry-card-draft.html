<!-- CrispyCrustBoule home page: entry card for the gluten-free trials page.
     Paste the <section> where section 05 belongs (between 04 The Process and 06 Adopt),
     and the <style> block into the page's CSS.
     Set href to wherever the trials page lives on the site (placeholder: /gluten-free).
     Update "Current best" and "Up next" when a new trial is baked. -->
<section class="gf-entry" aria-labelledby="gf-entry-title">
  <p class="gf-entry__label">· 05 · gluten-free trials ·</p>
  <a class="gf-entry__card" href="/gluten-free">

    <p class="gf-entry__text">Working toward a gluten-free sourdough loaf, one trial at a time. These loaves use their own gluten-free starter, not Oho.</p>

      <div><dt>Current best</dt><dd>v1.3 · best loaf yet</dd></div>
      <div><dt>Up next</dt><dd>v1.4 · not baked yet</dd></div>
    </dl>
    <span class="gf-entry__go">See every trial <span aria-hidden="true">→</span></span>
  </a>
</section>

<style>
.gf-entry {

  --gf-surface: #fffdf9;

  display: grid; gap: 14px;
  max-width: 640px; margin-inline: auto;
}
.gf-entry__label {
  margin: 0; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
